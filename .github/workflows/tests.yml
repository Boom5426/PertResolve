name: tests

# The README claims the estimators are checked against data whose answer is known. That
# claim is only worth making if something runs the checks, so this runs them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is what pyproject requires; the upper catches removals such as
        # ndarray.ptp(), which went in numpy 2.0 and would otherwise only fail for users.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show the resolved numpy and pandas
        run: python -c "import numpy, pandas; print(numpy.__version__, pandas.__version__)"
      - name: Run the test suite
        # These are simulations with hundreds of replicates, which is what lets them detect
        # a bias rather than only a crash. They take a few minutes; do not trim them.
        run: pytest -q --durations=5

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pertresolve"
version = "0.2.0"
description = "Measurement-resolution diagnostics for single-cell perturbation benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Kept in step with CITATION.cff and the README citation block, which are the two places
# authorship is declared. This field named a different author and a former institutional
# address long after both had been corrected everywhere else, so a `pip show` credited
# the package to someone the manuscript does not list. No email until one is chosen for
# the release; PEP 621 has no field for affiliation, which CITATION.cff carries instead.
authors = [
    { name = "Bo Li" },
]
keywords = ["single-cell", "perturbation", "benchmark", "measurement resolution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

# The resolution diagnostics are deliberately numpy-only. Everything they compute is a
# distance, a mean or a rank, and requiring a scientific stack to answer "can this dataset
# arbitrate a model comparison" would put the answer out of reach of the people who most
# need it, before they have committed to a pipeline. pandas is used only to hand back
# tables, and the heavier dependencies belong to the optional entry points that need them.
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
# Reading .h5ad, and reducing dimension before measuring.
io = ["anndata>=0.9", "scikit-learn>=1.2"]
# The benchmark loader and analysis scripts under scripts/.
bench = ["scipy>=1.10", "scikit-learn>=1.2", "pyyaml>=6.0", "openpyxl>=3.1"]
# Extracting ESM2 protein embeddings (results/reviewer_controls/esm2_extract.py).
# Neither the torch build nor the
# CUDA variant can be pinned usefully here; install the wheel that matches the
# machine's driver first, then this extra.
esm = ["torch>=2.0", "fair-esm>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
# Public PertResolve entry point.
pertresolve-resolution = "pertresolve.resolution.cli:main"

[project.urls]
Repository = "https://github.com/Boom5426/PertResolve"

[tool.setuptools.packages.find]
include = ["pertresolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The estimator tests are simulations with hundreds of replicates, which is what makes them
# able to detect a bias rather than only a crash. That costs about 25 seconds in total.
addopts = "-q --durations=5"
markers = [
    "workspace: needs the compute workspace named by PERTRESOLVE_DATA; skipped without it",
]
